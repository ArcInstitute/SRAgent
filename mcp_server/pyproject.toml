[project]
name = "sragent-mcp"
version = "0.1.0"
description = "MCP server exposing NCBI SRA / GEO dataset discovery and metadata fetch as deterministic tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SRAgent contributors" }]
dependencies = [
    "mcp>=1.2",
    "biopython>=1.83",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sragent-mcp = "sragent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sragent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit live NCBI E-utilities (requires internet)",
]
